<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>互動式校園導覽地圖</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&display=swap">
<style>
:root{
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#eef3f1;--surface:#ffffff;--ink:#14302b;--muted:#5a726d;--line:#cfdcd8;
  --brand:#0f5c52;--brand-ink:#ffffff;--accent:#f2b705;--chip:#e0ebe8;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--bg:#0d1917;--surface:#152724;--surface:#152724;--ink:#e3efec;--muted:#92aaa5;--line:#2a403b;
  --brand:#47b8a6;--brand-ink:#06201b;--accent:#f2b705;--chip:#1f332f;}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0d1917;--surface:#152724;--ink:#e3efec;--muted:#92aaa5;--line:#2a403b;--brand:#47b8a6;--brand-ink:#06201b;--accent:#f2b705;--chip:#1f332f;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;line-height:1.6}
header{padding:20px clamp(16px,4vw,40px) 12px;display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 20px;justify-content:space-between}
h1{margin:0;font-family:"Noto Serif TC","Songti TC",serif;font-size:clamp(22px,3.2vw,32px);letter-spacing:.04em}
header p{margin:0;color:var(--muted);font-size:14px}
main{display:grid;grid-template-columns:320px 1fr;gap:16px;padding:8px clamp(16px,4vw,40px) 32px;max-width:1280px;margin:0 auto}
aside{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;align-self:start}
aside h2,.card h2{margin:0 0 10px;font-size:15px;color:var(--muted);font-weight:500}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.chip,.place{font:inherit;cursor:pointer;color:var(--ink)}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:4px 14px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.list{display:flex;flex-direction:column;gap:6px}
.place{display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:10px 12px;border:1px solid var(--line);border-left:5px solid var(--line);border-radius:8px;background:var(--surface)}
.place:hover{background:var(--chip)}
.place[aria-current="true"]{border-left-color:var(--accent);background:var(--chip);font-weight:700}
.place small{display:block;color:var(--muted);font-weight:400;font-size:12px}
.empty{color:var(--muted);font-size:14px;margin:4px 0}
.stage{display:flex;flex-direction:column;gap:16px;min-width:0}
.map{position:relative;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--chip);height:clamp(280px,48vh,460px)}
.map iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;display:grid;grid-template-columns:minmax(160px,240px) 1fr;overflow:hidden}
.photo{min-height:200px;display:flex;flex-direction:column;justify-content:flex-end;padding:12px;color:#fff;font-size:12px;background:linear-gradient(150deg,var(--c1),var(--c2));position:relative}
.photo b{position:absolute;top:8px;left:14px;font-family:"Noto Serif TC",serif;font-size:72px;line-height:1;opacity:.35}
.body{padding:18px 20px}
.body h3{margin:0 0 4px;font-family:"Noto Serif TC",serif;font-size:24px}
.tag{display:inline-block;background:var(--chip);border-radius:6px;padding:0 8px;font-size:13px;color:var(--muted)}
.body p{margin:10px 0;max-width:60ch}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
dt{color:var(--muted)}dd{margin:0}
.actions{margin-top:14px;display:flex;gap:10px;flex-wrap:wrap}
.btn{display:inline-block;padding:8px 16px;border-radius:8px;text-decoration:none;font-size:14px;font-weight:500;border:1px solid var(--brand);color:var(--brand)}
.btn.primary{background:var(--brand);color:var(--brand-ink)}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.note{font-size:12px;color:var(--muted);margin:0}
@media (max-width:820px){main{grid-template-columns:1fr}.card{grid-template-columns:1fr}.photo{min-height:120px}}
</style>
</head>
<body>
<header>
  <h1>互動式校園導覽地圖</h1>
  <p>點選左側地點，地圖與資訊卡會同步切換</p>
</header>
<main>
  <aside>
    <h2>分類篩選</h2>
    <div class="chips" id="chips"></div>
    <h2>地點選單</h2>
    <div class="list" id="list"></div>
  </aside>
  <section class="stage">
    <div class="map"><iframe id="map" title="Google Maps 校園地圖" loading="lazy" referrerpolicy="no-referrer-when-downgrade" allowfullscreen></iframe></div>
    <article class="card" id="card" aria-live="polite"></article>
    <p class="note">地點依開南大學校園配置圖整理；開放時間與照片請在程式內的 PLACES 陣列補上。</p>
  </section>
</main>
<script>
// 校園名稱與地點資料：換成自己的學校即可
var CAMPUS = "開南大學";
var PLACES = [
  {id:"gate",name:"校門",type:"行政",c:["#4a5560","#7d8a96"],
   intro:"校園主要出入口，位於新興街側，進門後沿陽光大道可通往各棟大樓。",hours:"待補充",floor:"警衛室、車輛與人員出入管制",q:"校門"},
  {id:"ns",name:"NS 行政大樓",type:"行政",c:["#0f5c52","#2f8f7f"],
   intro:"位於陽光大道南端的行政中心，與大圓環相接，是校園的主要地標。",hours:"待補充",floor:"行政單位、餐廳與便利商店（依校園地圖標示）",q:"行政大樓"},
  {id:"a",name:"A 至誠樓",type:"教學",c:["#27406b","#4a6fa8"],
   intro:"位於陽光大道東側的教學大樓，與卓越樓相鄰。",hours:"待補充",floor:"教室與系所空間",q:"至誠樓"},
  {id:"b",name:"B 卓越樓",type:"教學",c:["#1d5a8a","#4a8fc4"],
   intro:"位於陽光大道東側的教學大樓，靠近圖書館與機車停車場。",hours:"待補充",floor:"教室與系所空間",q:"卓越樓"},
  {id:"t",name:"T 圖書館",type:"圖書",c:["#6b2d3c","#a8546a"],
   intro:"位於陽光大道北端，提供閱覽、自習與館藏查詢服務。",hours:"待補充",floor:"閱覽區、自習區與館藏區",q:"圖書館"},
  {id:"m",name:"M 學生第一宿舍",type:"宿舍",c:["#9a5a12","#d08a2f"],
   intro:"位於校園西側的學生宿舍，鄰近第二宿舍與餐廳、便利商店。",hours:"待補充",floor:"學生住宿空間",q:"學生第一宿舍"},
  {id:"w",name:"W 學生第二宿舍",type:"宿舍",c:["#8a4a12","#c47a35"],
   intro:"位於校園西側，與第一宿舍相鄰。",hours:"待補充",floor:"學生住宿空間",q:"學生第二宿舍"},
  {id:"l",name:"L 顏文隆國際會議廳",type:"活動",c:["#6b2d5c","#a2548f"],
   intro:"校園西側的會議與活動場地，位於永裕體育館旁。",hours:"待補充",floor:"國際會議廳與活動空間",q:"顏文隆國際會議廳"},
  {id:"y",name:"Y 永裕體育館",type:"體育",c:["#2e6b2d","#5aa458"],
   intro:"校園西側的室內體育場館，周邊另有田徑場、棒球場與球場。",hours:"待補充",floor:"室內運動場地",q:"永裕體育館"}
];
var types = ["全部"].concat(PLACES.map(function(p){return p.type}).filter(function(t,i,a){return a.indexOf(t)===i}));
var filter = "全部", current = PLACES[0].id;
var $ = function(id){return document.getElementById(id)};

function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function query(p){return encodeURIComponent(CAMPUS + " " + p.q)}

function renderChips(){
  $("chips").innerHTML = types.map(function(t){
    return '<button class="chip" aria-pressed="'+(t===filter)+'" data-type="'+esc(t)+'">'+esc(t)+'</button>';
  }).join("");
}
function renderList(){
  var items = PLACES.filter(function(p){return filter==="全部"||p.type===filter});
  $("list").innerHTML = items.length ? items.map(function(p){
    return '<button class="place" data-id="'+p.id+'" aria-current="'+(p.id===current)+'"><span>'+esc(p.name)+'<small>'+esc(p.type)+'</small></span></button>';
  }).join("") : '<p class="empty">這個分類目前沒有地點。</p>';
}
function renderCard(){
  var p = PLACES.filter(function(x){return x.id===current})[0];
  $("map").src = "https://maps.google.com/maps?q="+query(p)+"&z=17&output=embed&hl=zh-TW";
  $("card").innerHTML =
    '<div class="photo" style="--c1:'+p.c[0]+';--c2:'+p.c[1]+'"><b>'+esc(p.name.charAt(0))+'</b>實景照片位置（請替換）</div>'+
    '<div class="body"><h3>'+esc(p.name)+'</h3><span class="tag">'+esc(p.type)+'</span>'+
    '<p>'+esc(p.intro)+'</p>'+
    '<dl><dt>開放時間</dt><dd>'+esc(p.hours)+'</dd><dt>館內重點</dt><dd>'+esc(p.floor)+'</dd></dl>'+
    '<div class="actions">'+
    '<a class="btn primary" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination='+query(p)+'&travelmode=walking">規劃步行路線</a>'+
    '<a class="btn" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query='+query(p)+'">在 Google Maps 開啟</a>'+
    '</div></div>';
}
function render(){renderChips();renderList();renderCard()}

$("chips").addEventListener("click",function(e){
  var b = e.target.closest(".chip"); if(!b) return;
  filter = b.getAttribute("data-type");
  var first = PLACES.filter(function(p){return filter==="全部"||p.type===filter})[0];
  if(first) current = first.id;
  render();
});
$("list").addEventListener("click",function(e){
  var b = e.target.closest(".place"); if(!b) return;
  current = b.getAttribute("data-id");
  renderList(); renderCard();
});
render();
</script>
</body>
</html>
